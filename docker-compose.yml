version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: motiontwin-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./motiontwin.db
      - CORS_ORIGINS=*
      - DEFAULT_SIMULATION_HZ=30
    volumes:
      - ./backend/motiontwin.db:/app/motiontwin.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: motiontwin-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
